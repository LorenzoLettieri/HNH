<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>High Noon Hell</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #overlay {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.5); color: #f0c080; font: bold 28px monospace;
        pointer-events: none; /* clicks go through to the canvas below */
      }
      #overlay small { display: block; margin-top: 12px; font-size: 14px; opacity: 0.8; }
      #overlay { flex-direction: column; text-align: center; }

      /* --- Debug panel --- */
      #debug-panel {
        position: fixed; top: 0; right: 0; width: 340px; max-height: 100vh; overflow-y: auto;
        background: rgba(20, 10, 8, 0.92); color: #f0c080; font: 12px monospace;
        padding: 6px; box-sizing: border-box; z-index: 10;
      }
      #debug-panel[hidden] { display: none; }
      #debug-panel summary { cursor: pointer; font-weight: bold; padding: 6px 0; }
      #debug-panel .row { display: grid; grid-template-columns: 130px 1fr 60px; gap: 4px; align-items: center; margin: 2px 0; }
      #debug-panel .row input[type='checkbox'], #debug-panel .row input[type='color'] { grid-column: 2; justify-self: start; }
      #debug-panel input[type='number'] { width: 56px; background: #2a1810; color: inherit; border: 1px solid #5a3a20; }
      #debug-panel button { margin: 6px 0 10px; background: #5a3a20; color: inherit; border: 0; padding: 4px 8px; cursor: pointer; }

      /* Crosshair: a dot and four short ticks, drawn with CSS only. */
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 2px; height: 2px; margin: -1px 0 0 -1px;
        background: #ffe0a0; pointer-events: none;
        box-shadow: -8px 0 0 #ffe0a0, 8px 0 0 #ffe0a0, 0 -8px 0 #ffe0a0, 0 8px 0 #ffe0a0;
      }
      /* Hitmarker: 4 short diagonal strokes around the crosshair, flashed on hit.
         The color is a CSS variable: white for a hit, red for a knockdown. */
      #hitmarker {
        --c: #fff;
        position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px;
        pointer-events: none; opacity: 0;
        background:
          linear-gradient(45deg, transparent 44%, var(--c) 44%, var(--c) 56%, transparent 56%) top left / 7px 7px no-repeat,
          linear-gradient(-45deg, transparent 44%, var(--c) 44%, var(--c) 56%, transparent 56%) top right / 7px 7px no-repeat,
          linear-gradient(-45deg, transparent 44%, var(--c) 44%, var(--c) 56%, transparent 56%) bottom left / 7px 7px no-repeat,
          linear-gradient(45deg, transparent 44%, var(--c) 44%, var(--c) 56%, transparent 56%) bottom right / 7px 7px no-repeat;
      }
      #hitmarker.hit { animation: hitmarker 0.15s ease-out; }
      #hitmarker.kill { --c: #ff4020; animation: hitmarker 0.4s ease-out; width: 30px; height: 30px; margin: -15px 0 0 -15px; }
      @keyframes hitmarker { from { opacity: 1; } to { opacity: 0; } }
      /* Health bar, bottom-left above the debug text. */
      #health {
        position: fixed; left: 16px; bottom: 36px; width: 200px; height: 14px;
        background: #2a1008; border: 2px solid #120604; pointer-events: none;
      }
      #health-fill { height: 100%; width: 100%; background: linear-gradient(#e04020, #a01808); }
      /* Red vignette: transparent in the middle, red at the edges. */
      #damage {
        position: fixed; inset: 0; pointer-events: none; opacity: 0;
        background: radial-gradient(ellipse at center, transparent 45%, rgba(170, 10, 0, 0.75) 100%);
      }
      #death {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #ff3010; font: bold 64px monospace; letter-spacing: 8px; pointer-events: none; opacity: 0;
        text-shadow: 4px 4px 0 #000;
      }
      #ammo {
        position: fixed; right: 16px; bottom: 10px; color: #f0c080;
        font: bold 26px monospace; letter-spacing: 4px; pointer-events: none;
      }

      #hud {
        position: fixed; left: 12px; bottom: 10px; color: #f0c080;
        font: bold 18px monospace; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="overlay">Click to play<small>WASD · Spazio · Click spara · R ricarica · K respawn · T atmosfera · P pixel · \ (tasto sotto Esc) debug</small></div>
    <div id="hud"></div>
    <div id="crosshair"></div>
    <div id="hitmarker"></div>
    <div id="ammo"></div>
    <div id="damage"></div>
    <div id="health"><div id="health-fill"></div></div>
    <div id="death">SEI MORTO</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
